<li class="nav-item"><a class="nav-link" href="{% url 'cms:contact.html' %}">Contact</a></li>
</ul>
</div>
</div>

<h2 class="text-start mb-4" style="color: var(--bs-red);font-weight: bold;">{{blog_post.title}}</h2>
{% if blog_post.teaser %}<h3 class="text-start mb-4" style="color: rgba(220,53,69,0.75);font-weight: bold;">{{ blog_post.teaser }}</h3>{% endif %}
